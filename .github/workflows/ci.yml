# CineFlow 持续集成
#
# 职责：每次 push / PR 都跑与本机一致的门禁，尽早发现「本地绿、CI 红」。
#
# 与本机的一致性：本机用 PowerShell 门禁脚本（bash 在某些沙箱下不可用），
# CI 在 ubuntu-latest 上可以正常用 shell，这里直接调同等逻辑的脚本。
# 版本号一致性由 tool/bump_version.ps1 负责，Linux 上用 pwsh 也能跑。
#
# 为什么不跑真机验收：布局、手势、硬解这类只能在真机上看（AGENTS.md §6.4），
# CI 覆盖不到，靠 §8.2 的人工走查清单兜底——**不要把 CI 绿当成发布就绪**。

name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 与 pubspec 的 environment.sdk / AGENTS.md §2 记录的 Flutter 对齐
          flutter-version: '3.47.5'

      - name: 取依赖
        run: flutter pub get

      - name: 静态分析（必须 0 error / 0 warning）
        run: |
          # ⚠️ **不能直接 `flutter analyze`**（判定标准是"0 error / 0 warning"，
          #    不是退出码）。
          #
          # ## 为什么（长期存在的 CI 缺陷，2026-10-09 修）
          # 本仓库有 **5 条已知豁免的 info**（AGENTS §5.7 记着 douban 那 3 条，
          # 后又多 2 条）⇒ `flutter analyze` **退出码恒为 1** ⇒ CI 恒失败。
          #
          # 证据：v0.3.2 与 v0.3.1 的多次 run 都停在"静态分析与测试"。
          #
          # `scripts/check-dev.ps1` 早已处理对（直接数诊断行前缀），
          # **但 CI 漏了** —— 两处从未对齐，正是"两个地方各写一遍必然走偏"。
          #
          # ## 判定
          # 数 `error - ` / `warning - ` 前缀行（各版本稳定的契约），
          # **不依赖汇总行**（check-dev 的注释记录过：3.47.5 只有逐条诊断行，
          #  `No issues found` 仅在完全无 issue 时出现）。
          ANALYZE_OUT=$(flutter analyze 2>&1 || true)
          echo "$ANALYZE_OUT"
          ERRS=$(printf '%s\n' "$ANALYZE_OUT" | grep -cE '^[[:space:]]*error[[:space:]]+-' || true)
          WARNS=$(printf '%s\n' "$ANALYZE_OUT" | grep -cE '^[[:space:]]*warning[[:space:]]+-' || true)
          echo "analyze: error=$ERRS warning=$WARNS"
          if [ "$ERRS" != "0" ] || [ "$WARNS" != "0" ]; then
            echo "::error::flutter analyze 有 $ERRS 个 error / $WARNS 个 warning"
            exit 1
          fi
          echo "✅ 0 error / 0 warning（info 已豁免）"

      - name: 单元测试
        run: flutter test

  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 版本号三处一致（VERSION / pubspec / lib/core/version.dart）
        run: pwsh -File tool/bump_version.ps1 -Check

  docs-guard:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 敏感信息门禁
        shell: pwsh
        run: powershell -File scripts/check-secrets.ps1

      - name: 文档与链接门禁
        shell: pwsh
        run: powershell -File scripts/check-docs.ps1
