# 发布：打 v* tag 时构建 arm64 release APK 并创建 GitHub Release。
#
# 设计要点：
#   - APK **不进 git**：30MB 二进制会永久撑大仓库历史（且 .gitignore 已排除 /build/）。
#     二进制的归宿是 Release 附件，这里是唯一发布通道。
#   - 走 draft → publish 两段式：先建草稿再上传产物，产物齐全才转正，
#     避免用户看到「建好了但下不到东西」的半截 Release。
#   - changelog 优先：若 docs/changelog/vX.Y.Z.md 已存在就用它当 Release 正文；
#     否则退回自动生成的提交清单（release-notes.yml 之后会自动覆盖同步）。
#   - 校验 tag 与 VERSION 一致：防止 tag 打错版本。

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，如 v0.2.0'
        required: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'

      - name: 装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 解析 tag 并校验与 VERSION 一致
        id: v
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          FILE_VER="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag 版本: $VER / VERSION 文件: $FILE_VER"
          if [ "$VER" != "$FILE_VER" ]; then
            echo "::error::tag($VER) 与 VERSION 文件($FILE_VER) 不一致，拒绝发布"
            exit 1
          fi
          PW_VER="$(grep -o "const String kAppVersion = '[^']*'" lib/core/version.dart | sed "s/.*'\(.*\)'.*/\1/" | tr -d "\r")"
          echo "lib/core/version.dart: $PW_VER"
          if [ "$VER" != "$PW_VER" ]; then
            echo "::error::tag($VER) 与 lib/core/version.dart($PW_VER) 不一致，拒绝发布"
            exit 1
          fi
          PS_VER="$(sed -n 's/^version: *\([0-9.]*\)+.*/\1/p' pubspec.yaml | tr -d '[:space:]')"
          echo "pubspec.yaml: $PS_VER"
          if [ "$VER" != "$PS_VER" ]; then
            echo "::error::tag($VER) 与 pubspec.yaml($PS_VER) 不一致，拒绝发布"
            exit 1
          fi
          # ★ 版本号必须**递增**：GitHub Release 按 tag 区分，降级会让用户装回旧包
          LATEST="$(git tag -l 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -n1 || true)"
          if [ -n "$LATEST" ]; then
            echo "上一个 tag: $LATEST"
            if [ "$(printf '%s\n%s\n' "${LATEST#v}" "$VER" | sort -V | tail -n1)" != "$VER" ]; then
              echo "::error::$VER 不大于已有 tag ${LATEST#v}，拒绝发布（版本号必须递增）"
              exit 1
            fi
            if [ "${LATEST#v}" = "$VER" ]; then
              echo "::error::版本 $VER 已存在，拒绝重复发布"
              exit 1
            fi
          fi

      - name: 取依赖
        run: flutter pub get

      - name: 静态分析与测试（发布前门禁）
        run: |
          flutter analyze
          flutter test

      - name: 构建 arm64 release APK（按架构拆分 + 混淆）
        run: |
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info=build/symbols
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "dist/CineFlow-${{ steps.v.outputs.ver }}-arm64-v8a.apk"

      - name: 生成校验和
        shell: bash
        run: |
          cd dist
          sha256sum *.apk > checksums.txt
          cat checksums.txt

      - name: 上传构建产物（供排查）
        uses: actions/upload-artifact@v4
        with:
          name: cineflow-apk-${{ steps.v.outputs.ver }}
          path: |
            dist/*.apk
            dist/checksums.txt
            build/symbols/*
          if-no-files-found: error

  publish:
    needs: build-apk
    runs-on: ubuntu-latest
    # ★★ 审批门（机械强制）★★
    #
    # GitHub 的 Environment protection rule：`release` 环境配了 Required reviewers 后，
    # 这个 job 会**挂起等待人工批准**，不批就一直不动。
    # 这与 docs/AI-DISTRIBUTION.md §3 的审批单是同一道门的两半：
    #   · 文档那一半管"AI 必须先问、必须拿审批单"
    #   · 这一半管"就算 AI 擅自 push 了 tag，也过不去"
    #
    # ⚠️ 需要在仓库设置里启用一次（Settings → Environments → release →
    #    Required reviewers 选上你自己）。**没配置时此 job 不会挂起**，
    #    所以务必确认它已开启——否则这道门形同虚设。
    environment: release
    steps:
      # ★ 必须先 checkout：下面的步骤要读 `docs/changelog/vX.Y.Z.md` 作为 Release 正文。
      #   没有这一步时工作区是空的 → `[ -f "$NOTES" ]` 恒为假 →
      #   总是走 `--generate-notes` 兜底，**精心写的 changelog 根本用不上**。
      #   （这是本工作流的真实缺陷：设计上"changelog 优先"，实际从未生效。）
      - uses: actions/checkout@v4

      - name: 计算版本号（与构建任务产物名一致：去掉 v 前缀）
        id: v2
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: 下载 APK
        uses: actions/download-artifact@v4
        with:
          name: cineflow-apk-${{ steps.v2.outputs.ver }}
          path: dist

      # ★ 红线守卫：本工作流**只增不删**。任何情况下都不许动已有 Release。
      #   见 docs/AI-DISTRIBUTION.md §4（用户明确要求）。
      #
      # ⚠️ 为什么用 `gh api` 而不是 `gh release view`（实测踩过，是本工作流的核心缺陷）：
      #   GitHub 的 `GET /releases/tags/<tag>` **对草稿返回 404**
      #   （实测：草稿存在时该端点仍 404）→ `gh release view <tag>` 在只有草稿时**也失败**。
      #   于是每次重跑都以为"Release 不存在"→ 再 `create` 一个 → **同名草稿越积越多**
      #   → 最后 `gh release upload <tag>` 无法在多个同名草稿间唯一解析 → publish 失败。
      #
      #   正解：用 `gh api` 列**全部** Release（含草稿），再按 tag 过滤。
      - name: 守卫 · 确认目标 Release 尚不存在（只增不删）
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "现有 Release 列表（本次操作绝不会删除其中任何一个）："
          gh release list --limit 30 || true

          # 列出所有 Release（含草稿），筛出本 tag 的
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name==\"$TAG\")] | {n: length, drafts: ([.[] | select(.draft)] | length), published: ([.[] | select(.draft|not)] | length), ids: [.[].id]}" \
            > /tmp/rel.json 2>/dev/null || echo '{"n":0,"drafts":0,"published":0,"ids":[]}' > /tmp/rel.json
          cat /tmp/rel.json

          N=$(jq -r '.n' /tmp/rel.json)
          PUB=$(jq -r '.published' /tmp/rel.json)
          IDS=$(jq -r '.ids | join(" ")' /tmp/rel.json)

          if [ "$PUB" != "0" ]; then
            echo "::error::Release $TAG 已发布（非草稿）。按 AI-DISTRIBUTION.md §4，"
            echo "::error::不得覆盖已发布版本 —— 请递增版本号后重新发布。"
            exit 1
          fi

          # ★ 去重：同名草稿只能留一个，否则后面的 upload 无法唯一解析目标。
          #   草稿对用户不可见，删多余草稿属 AI-DISTRIBUTION §4 的**明确例外条款**。
          KEEP=""
          if [ "$N" -gt 1 ]; then
            echo "发现 $N 个同名草稿 —— 只保留第一个，删除多余（草稿不可见，§4 例外）"
            FIRST=1
            for id in $IDS; do
              if [ "$FIRST" = "1" ]; then
                KEEP="$id"; FIRST=0
              else
                echo "  删除多余草稿 id=$id"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id" || true
              fi
            done
          elif [ "$N" = "1" ]; then
            KEEP=$(echo "$IDS" | awk '{print $1}')
          fi

          echo "keep_release_id=$KEEP" >> "$GITHUB_OUTPUT"
          if [ -n "$KEEP" ]; then
            echo "已存在同名**草稿**（id=$KEEP），允许重跑（§4 例外条款）"
          else
            echo "Release $TAG 不存在，将新建（不影响任何旧版本）"
          fi

      - name: 建草稿 Release 并上传 APK
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_ID: ${{ steps.guard.outputs.keep_release_id }}
        shell: bash
        run: |
          set -o pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          NOTES="docs/changelog/v${VER}.md"

          # 把诊断写进 **job summary**（可经 API 匿名读取，便于排查 CI 失败；
          # 日志本身需要额外权限，本仓库的自动化取不到）。
          {
            echo "### release publish 诊断"
            echo ""
            echo '```'
            echo "TAG=$TAG VER=$VER"
            echo "NOTES=$NOTES exists=$([ -f "$NOTES" ] && echo yes || echo no)"
            echo "gh=$(command -v gh || echo MISSING)"
            echo "gh-version=$(gh --version 2>&1 | head -1)"
            echo "token-sha=${GITHUB_SHA:0:7}"
            echo "--- dist ---"
            ls -la dist/ 2>&1 | head -12
            echo "--- gh auth ---"
            gh auth status 2>&1 | head -8
            echo "--- repo perms (via gh) ---"
            gh api repos/${GITHUB_REPOSITORY} --jq '.permissions' 2>&1 | head -3
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

          # ★ 用 guard 步骤给的结果，**不要**再用 `gh release view` 判断存在性：
          #   它对草稿返回 404（实测），是本工作流此前"越跑草稿越多"的根因。
          if [ -n "$KEEP_ID" ]; then
            echo "已存在草稿 id=$KEEP_ID —— 只改正文，不重建"
            if [ -f "$NOTES" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/$KEEP_ID" \
                -f name="CineFlow v${VER}" -F body="$(cat "$NOTES")" >/dev/null
            else
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/$KEEP_ID" \
                -f name="CineFlow v${VER}" >/dev/null
            fi
          else
            if [ -f "$NOTES" ]; then
              echo "使用 $NOTES 作为 Release 正文"
              gh release create "$TAG" --draft --title "CineFlow v${VER}" --notes-file "$NOTES"
            else
              echo "::warning::缺少 $NOTES，退回自动生成正文（随后 release-notes.yml 会自动同步）"
              gh release create "$TAG" --draft --title "CineFlow v${VER}" --generate-notes
            fi
          fi

          # 只上传 APK 与校验和；符号表留在构建产物里，不进 Release。
          #
          # ⚠️ 这里**故意用 release id 而不是 tag**：`gh release upload <tag>` 在
          #    同名草稿不唯一时会失败；用 id 则永远指向确定的目标。
          RID="$KEEP_ID"
          if [ -z "$RID" ]; then
            RID=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                  --jq "[.[] | select(.tag_name==\"$TAG\")][0].id")
          fi
          echo "上传目标 release id=$RID"
          # --clobber 仅用于**草稿重跑**覆盖自己的同名附件，绝不对已发布 Release 使用。
          gh release upload "$RID" dist/*.apk dist/checksums.txt --clobber

      - name: 校验产物齐全后转正
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_ID: ${{ steps.guard.outputs.keep_release_id }}
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # 同上去草稿问题：用 id 查附件数
          if [ -z "$KEEP_ID" ]; then
            KEEP_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                      --jq "[.[] | select(.tag_name==\"$TAG\")][0].id")
          fi
          N=$(gh api "repos/${GITHUB_REPOSITORY}/releases/$KEEP_ID" --jq '.assets | length')
          echo "Release 附件数：$N"
          if [ "$N" -lt 2 ]; then
            echo "::error::产物不全（期望至少 APK + checksums），Release 保持草稿"
            exit 1
          fi
          # 转正同样用 id（草稿的 tag 解析不可靠，见上）
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/$KEEP_ID" \
            -F draft=false >/dev/null
          echo "Release $TAG 已发布（id=$KEEP_ID）"
