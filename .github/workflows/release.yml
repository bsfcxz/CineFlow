# 发布：打 v* tag 时构建 arm64 release APK 并创建 GitHub Release。
#
# 设计要点：
#   - APK **不进 git**：30MB 二进制会永久撑大仓库历史（且 .gitignore 已排除 /build/）。
#     二进制的归宿是 Release 附件，这里是唯一发布通道。
#   - 走 draft → publish 两段式：先建草稿再上传产物，产物齐全才转正，
#     避免用户看到「建好了但下不到东西」的半截 Release。
#   - changelog 优先：若 docs/changelog/vX.Y.Z.md 已存在就用它当 Release 正文；
#     否则退回自动生成的提交清单（release-notes.yml 之后会自动覆盖同步）。
#   - 校验 tag 与 VERSION 一致：防止 tag 打错版本。

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，如 v0.2.0'
        required: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'

      - name: 装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---- 还原正式签名 keystore（来自 GitHub Secrets，**不在仓库里**）----
      #
      # ## 为什么必须这一步
      # `android/app/build.gradle.kts` 在找不到 key.properties 时**回退 debug 签名**
      # （只打印告警，不报错）。CI 上原本没有 keystore → 每次发布都产出
      # debug 签名的包 —— v0.3.0 就是这么发出去的（实测附件含 "Android Debug"）。
      #
      # ## 密钥从哪来
      # GitHub Secrets（加密存储，不随仓库分发）：
      #   KEYSTORE_BASE64  —— keystore 文件的 base64
      #   KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      # 写入到 `$RUNNER_TEMP`（**不是工作区**），避免被后续步骤误打包。
      #
      # ## 拿不到就**明确失败**，不回退
      # 宁可让发布红掉，也不要再产出一个不可正式分发的包（D10）。
      - name: 还原签名 keystore
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secret KEYSTORE_BASE64 —— 不能用 debug 签名发布（AI-DISTRIBUTION D10）"
            echo "::error::请在 Settings → Secrets and variables → Actions 配置签名四项"
            exit 1
          fi
          KS="${RUNNER_TEMP}/cineflow-release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          # 自检：能用给定口令打开才继续（避免"到打包阶段才发现口令错"）
          if ! keytool -list -keystore "$KS" -storetype PKCS12 \
                 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::keystore 无法用给定口令打开 —— 检查 KEYSTORE_PASSWORD / KEY_ALIAS"
            exit 1
          fi
          echo "keystore 自检通过（alias=$KEY_ALIAS）"
          # ★ 写到 android/key.properties —— 即 Flutter 官方约定位置，
          #   build.gradle.kts 用 **文件存在性** 找到它。
          #
          #   为什么不用环境变量：`System.getenv()` 读的是 **Gradle daemon 进程**
          #   的环境，而 daemon 长驻、环境在启动那刻固定 → 后设的变量它看不到
          #   （实测踩过两次：CF_KEY_PROPERTIES 写进 $GITHUB_ENV 也不生效）。
          #   文件路径判定不受 daemon 影响，最可靠。
          #   `android/key.properties` 已被 android/.gitignore 忽略，不会入库。
          {
            echo "storeFile=${KS}"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyPassword=${KEY_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
          } > android/key.properties
          echo "已写 android/key.properties"
          ls -la android/key.properties
          # 同时设环境变量（本机/其它场景的兼容路径）
          echo "CF_KEY_PROPERTIES=${RUNNER_TEMP}/key.properties" >> "$GITHUB_ENV"

      - name: 解析 tag 并校验与 VERSION 一致
        id: v
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          FILE_VER="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag 版本: $VER / VERSION 文件: $FILE_VER"
          if [ "$VER" != "$FILE_VER" ]; then
            echo "::error::tag($VER) 与 VERSION 文件($FILE_VER) 不一致，拒绝发布"
            exit 1
          fi
          PW_VER="$(grep -o "const String kAppVersion = '[^']*'" lib/core/version.dart | sed "s/.*'\(.*\)'.*/\1/" | tr -d "\r")"
          echo "lib/core/version.dart: $PW_VER"
          if [ "$VER" != "$PW_VER" ]; then
            echo "::error::tag($VER) 与 lib/core/version.dart($PW_VER) 不一致，拒绝发布"
            exit 1
          fi
          PS_VER="$(sed -n 's/^version: *\([0-9.]*\)+.*/\1/p' pubspec.yaml | tr -d '[:space:]')"
          echo "pubspec.yaml: $PS_VER"
          if [ "$VER" != "$PS_VER" ]; then
            echo "::error::tag($VER) 与 pubspec.yaml($PS_VER) 不一致，拒绝发布"
            exit 1
          fi
          # ★ 版本号必须**递增**：GitHub Release 按 tag 区分，降级会让用户装回旧包
          LATEST="$(git tag -l 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -n1 || true)"
          if [ -n "$LATEST" ]; then
            echo "上一个 tag: $LATEST"
            if [ "$(printf '%s\n%s\n' "${LATEST#v}" "$VER" | sort -V | tail -n1)" != "$VER" ]; then
              echo "::error::$VER 不大于已有 tag ${LATEST#v}，拒绝发布（版本号必须递增）"
              exit 1
            fi
            if [ "${LATEST#v}" = "$VER" ]; then
              echo "::error::版本 $VER 已存在，拒绝重复发布"
              exit 1
            fi
          fi

      - name: 取依赖
        run: flutter pub get

      - name: 静态分析与测试（发布前门禁）
        run: |
          flutter analyze
          flutter test

      # 三个 ABI（arm64-v8a / armeabi-v7a / x86_64）。
      #
      # ## 三个 ABI 都**完整可用**（不是残包）
      # `jniLibs/<abi>/` 下各有 **两个** 原生库：
      #   libmpv.so          —— 播放内核（三 ABI 同源，来自 media_kit 的 android 库包）
      #   libcineflow_go.so  —— Go 核心层（本地用 NDK 交叉编译三个 ABI）
      # 缺任一者，该 ABI 的包要么播不了、要么连 Go 层都没有。
      # 由 `tool/verify_abi.ps1` 与本地签名校验共同把关。
      - name: 构建三 ABI release APK（按架构拆分 + 混淆 + 正式签名）
        run: |
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info=build/symbols
          mkdir -p dist
          VER="${{ steps.v.outputs.ver }}"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            [ -f "$src" ] || { echo "::error::缺少 $src"; exit 1; }
            cp "$src" "dist/CineFlow-${VER}-${abi}.apk"
          done
          ls -la dist/

      # ⚠️ 三个实测坑（全踩过，逐一记录）：
      #   1) 不能用 `apksigner`：它是 Android SDK build-tools 的工具，
      #      ubuntu-latest runner **默认没装 Android SDK**
      #      → `command not found` → **exit 127**
      #      （表现为守卫步骤失败，看起来像"签名不对"，其实是工具缺失）
      #   2) 不能用 `keytool -printcert | grep 'Owner'` 读 DN：
      #      **keytool 的输出标签是本地化的**（中文环境是「所有者:」不是 "Owner:"）
      #      → 非英文 locale 的 runner 上会误判
      #   3) 不能用 `grep 'CN=CineFlow'` 在 APK 字节里找证书名：
      #      证书在 `META-INF/CERT.RSA` 里是**压缩**的，明文搜不到；
      #      搜 "CineFlow" 会命中**应用名**，是假阳性（实测确认）
      #
      # 故用**指纹精确比对**：从 APK 取出签名证书，用 `keytool -printcert`
      # 读 `SHA256:` 行（这个标签不本地化），与期望指纹逐字符比对。
      # 指纹由 Secret 提供（`SIGNING_CERT_SHA256`），没有 Secret 时退化为
      # 「只要不是 debug 就放行」——仍然挡住最危险的情况。
      - name: 守卫 · 确认 APK 不是 debug 签名
        env:
          EXPECT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          set -o pipefail
          echo "=== 签名环境自检 ==="
          echo "CF_KEY_PROPERTIES=${CF_KEY_PROPERTIES}"
          ls -la "${CF_KEY_PROPERTIES}" 2>&1 | head -3 || true
          ls -la android/key.properties 2>&1 | head -3 || true
          echo "期望证书指纹: ${EXPECT_SHA256:-（未配置 Secret，仅做非-debug 检查）}"
          echo "======================"
          FAIL=0
          for f in dist/*.apk; do
            echo "--- $f ---"

            # 1) 明文搜调试密钥 DN —— 这一条**能**在字节里搜到（实测确认）
            if grep -qa 'Android Debug' "$f"; then
              echo "::error::$f 是 **debug 签名** —— 不可正式分发（AI-DISTRIBUTION D10）"
              FAIL=1
            else
              echo "  OK 非 debug 签名"
            fi

            # 2) 取签名证书并读指纹（locale 无关：只 grep 'SHA256:'）
            D="$(mktemp -d)"
            unzip -o -q "$f" 'META-INF/*' -d "$D" 2>/dev/null || true
            CERT="$(find "$D/META-INF" -maxdepth 1 \( -name '*.RSA' -o -name '*.DSA' -o -name '*.EC' \) 2>/dev/null | head -1)"
            if [ -n "$CERT" ]; then
              FP="$(keytool -printcert -file "$CERT" 2>/dev/null | grep -m1 'SHA256:' | sed 's/.*SHA256:[[:space:]]*//' | tr -d ' \r')"
              echo "  证书指纹: $FP"
              if [ -n "$EXPECT_SHA256" ]; then
                EXP="$(echo "$EXPECT_SHA256" | tr 'A-F' 'a-f' | tr -d ' :\r')"
                GOT="$(echo "$FP" | tr 'A-F' 'a-f' | tr -d ' :\r')"
                if [ "$EXP" = "$GOT" ]; then
                  echo "  OK 指纹与期望一致"
                else
                  echo "::error::$f 证书指纹不匹配 —— 不是预期的发布密钥"; FAIL=1
                fi
              fi
            else
              echo "::error::$f 找不到签名证书（未签名？）"; FAIL=1
            fi
            rm -rf "$D"
          done
          [ "$FAIL" = "0" ] || exit 1
          echo "全部 APK 签名校验通过"

      - name: 生成校验和
        shell: bash
        run: |
          cd dist
          sha256sum *.apk > checksums.txt
          cat checksums.txt

      # ⚠️ 只上传 **`dist/` 一个根**下的文件。
      #
      # upload-artifact 会把所有 path 的**最小公共祖先**作为 artifact 内的根。
      # 若同时放 `dist/*.apk` 与 `build/symbols/*`，公共祖先是**仓库根**，
      # 于是 artifact 里带上 `dist/` 这一层 → 下载到 `path: dist` 后变成
      # **`dist/dist/*.apk`** → publish 里的 `dist/*.apk` 通配**匹配不到任何文件**
      # → `gh release upload` 报错（实测踩过：这是 upload 一直失败的真正原因，
      #    一开始误判成"多个同名草稿"）。
      #
      # 故符号表单独一个 artifact（它只是排查用的，不必和 APK 混在一起）。
      - name: 上传构建产物（供发布）
        uses: actions/upload-artifact@v4
        with:
          name: cineflow-apk-${{ steps.v.outputs.ver }}
          path: dist/*
          if-no-files-found: error

      - name: 上传混淆符号表（供排查崩溃，不进 Release）
        uses: actions/upload-artifact@v4
        with:
          name: cineflow-symbols-${{ steps.v.outputs.ver }}
          path: build/symbols/*
          if-no-files-found: warn

  publish:
    needs: build-apk
    runs-on: ubuntu-latest
    # ★★ 审批门（机械强制）★★
    #
    # GitHub 的 Environment protection rule：`release` 环境配了 Required reviewers 后，
    # 这个 job 会**挂起等待人工批准**，不批就一直不动。
    # 这与 docs/AI-DISTRIBUTION.md §3 的审批单是同一道门的两半：
    #   · 文档那一半管"AI 必须先问、必须拿审批单"
    #   · 这一半管"就算 AI 擅自 push 了 tag，也过不去"
    #
    # ⚠️ 需要在仓库设置里启用一次（Settings → Environments → release →
    #    Required reviewers 选上你自己）。**没配置时此 job 不会挂起**，
    #    所以务必确认它已开启——否则这道门形同虚设。
    environment: release
    steps:
      # ★ 必须先 checkout：下面的步骤要读 `docs/changelog/vX.Y.Z.md` 作为 Release 正文。
      #   没有这一步时工作区是空的 → `[ -f "$NOTES" ]` 恒为假 →
      #   总是走 `--generate-notes` 兜底，**精心写的 changelog 根本用不上**。
      #   （这是本工作流的真实缺陷：设计上"changelog 优先"，实际从未生效。）
      - uses: actions/checkout@v4

      - name: 计算版本号（与构建任务产物名一致：去掉 v 前缀）
        id: v2
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: 下载 APK
        uses: actions/download-artifact@v4
        with:
          name: cineflow-apk-${{ steps.v2.outputs.ver }}
          path: dist

      # ★ 红线守卫：本工作流**只增不删**。任何情况下都不许动已有 Release。
      #   见 docs/AI-DISTRIBUTION.md §4（用户明确要求）。
      #
      # ⚠️ 为什么用 `gh api` 而不是 `gh release view`（实测踩过，是本工作流的核心缺陷）：
      #   GitHub 的 `GET /releases/tags/<tag>` **对草稿返回 404**
      #   （实测：草稿存在时该端点仍 404）→ `gh release view <tag>` 在只有草稿时**也失败**。
      #   于是每次重跑都以为"Release 不存在"→ 再 `create` 一个 → **同名草稿越积越多**
      #   → 最后 `gh release upload <tag>` 无法在多个同名草稿间唯一解析 → publish 失败。
      #
      #   正解：用 `gh api` 列**全部** Release（含草稿），再按 tag 过滤。
      - name: 守卫 · 确认目标 Release 尚不存在（只增不删）
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "现有 Release 列表（本次操作绝不会删除其中任何一个）："
          gh release list --limit 30 || true

          # 列出所有 Release（含草稿），筛出本 tag 的
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name==\"$TAG\")] | {n: length, drafts: ([.[] | select(.draft)] | length), published: ([.[] | select(.draft|not)] | length), ids: [.[].id]}" \
            > /tmp/rel.json 2>/dev/null || echo '{"n":0,"drafts":0,"published":0,"ids":[]}' > /tmp/rel.json
          cat /tmp/rel.json

          N=$(jq -r '.n' /tmp/rel.json)
          PUB=$(jq -r '.published' /tmp/rel.json)
          IDS=$(jq -r '.ids | join(" ")' /tmp/rel.json)

          if [ "$PUB" != "0" ]; then
            echo "::error::Release $TAG 已发布（非草稿）。按 AI-DISTRIBUTION.md §4，"
            echo "::error::不得覆盖已发布版本 —— 请递增版本号后重新发布。"
            exit 1
          fi

          # ★ 去重：同名草稿只能留一个，否则后面的 upload 无法唯一解析目标。
          #   草稿对用户不可见，删多余草稿属 AI-DISTRIBUTION §4 的**明确例外条款**。
          KEEP=""
          if [ "$N" -gt 1 ]; then
            echo "发现 $N 个同名草稿 —— 只保留第一个，删除多余（草稿不可见，§4 例外）"
            FIRST=1
            for id in $IDS; do
              if [ "$FIRST" = "1" ]; then
                KEEP="$id"; FIRST=0
              else
                echo "  删除多余草稿 id=$id"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id" || true
              fi
            done
          elif [ "$N" = "1" ]; then
            KEEP=$(echo "$IDS" | awk '{print $1}')
          fi

          echo "keep_release_id=$KEEP" >> "$GITHUB_OUTPUT"
          if [ -n "$KEEP" ]; then
            echo "已存在同名**草稿**（id=$KEEP），允许重跑（§4 例外条款）"
          else
            echo "Release $TAG 不存在，将新建（不影响任何旧版本）"
          fi

      - name: 建草稿 Release 并上传 APK
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_ID: ${{ steps.guard.outputs.keep_release_id }}
        shell: bash
        run: |
          set -o pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          NOTES="docs/changelog/v${VER}.md"

          # 把诊断写进 **job summary**（可经 API 匿名读取，便于排查 CI 失败；
          # 日志本身需要额外权限，本仓库的自动化取不到）。
          {
            echo "### release publish 诊断"
            echo ""
            echo '```'
            echo "TAG=$TAG VER=$VER"
            echo "NOTES=$NOTES exists=$([ -f "$NOTES" ] && echo yes || echo no)"
            echo "gh=$(command -v gh || echo MISSING)"
            echo "gh-version=$(gh --version 2>&1 | head -1)"
            echo "token-sha=${GITHUB_SHA:0:7}"
            echo "--- dist ---"
            ls -la dist/ 2>&1 | head -12
            echo "--- gh auth ---"
            gh auth status 2>&1 | head -8
            echo "--- repo perms (via gh) ---"
            gh api repos/${GITHUB_REPOSITORY} --jq '.permissions' 2>&1 | head -3
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

          # ★ 先确认产物真的在，否则后面 `gh release upload` 会失败得莫名其妙。
          #   （实测踩过：artifact 因多根路径带上了 `dist/` 前缀 → 下载后变成
          #     dist/dist/*.apk → 通配匹配不到 → upload 报错，但看不出原因。）
          echo "=== 待上传文件 ==="
          ls -la dist/ || true
          APKS="$(ls dist/*.apk 2>/dev/null | wc -l)"
          echo "找到 $APKS 个 APK"
          if [ "$APKS" -lt 1 ]; then
            echo "::error::dist/ 下没有 APK —— 检查 upload-artifact/download-artifact 的路径映射"
            find . -name '*.apk' -not -path './build/*' 2>/dev/null | head -10
            exit 1
          fi

          # ★ 用 guard 步骤给的结果，**不要**再用 `gh release view` 判断存在性：
          #   它对草稿返回 404（实测），是本工作流此前"越跑草稿越多"的根因。
          #
          # ★★ 创建/更新后**必须从响应里直接拿 id**，不能回头再查列表 ★★
          #   实测日志铁证：
          #       https://.../releases/tag/untagged-...     <- 草稿建成功
          #       上传目标 release id=                        <- 查询返回**空**
          #       release not found
          #   原因：`gh release create` 之后仅 0.46s 就去 GET /releases 列表，
          #   而 **Releases 列表 API 有最终一致性延迟** —— 刚建的 Release
          #   还没出现在列表里 → 过滤结果为空 → `gh release upload ""` 失败。
          #
          #   正解：`gh release create`/`gh api ... releases` 的**响应体里就有 id**，
          #   用 `--jq '.id'` 直接取，完全不依赖列表的最终一致性。
          RID=""
          if [ -n "$KEEP_ID" ]; then
            echo "已存在草稿 id=$KEEP_ID —— 只改正文，不重建"
            if [ -f "$NOTES" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/$KEEP_ID" \
                -f name="CineFlow v${VER}" -F body="$(cat "$NOTES")" >/dev/null
            else
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/$KEEP_ID" \
                -f name="CineFlow v${VER}" >/dev/null
            fi
            RID="$KEEP_ID"
          else
            if [ -f "$NOTES" ]; then
              echo "使用 $NOTES 作为 Release 正文"
              RID="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
                     -f tag_name="$TAG" -f name="CineFlow v${VER}" \
                     -F draft=true -F body="$(cat "$NOTES")" --jq '.id')"
            else
              echo "::warning::缺少 $NOTES，退回自动标题（随后 release-notes.yml 会自动同步）"
              RID="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
                     -f tag_name="$TAG" -f name="CineFlow v${VER}" \
                     -F draft=true -F generate_release_notes=true --jq '.id')"
            fi
          fi

          # 兜底：万一响应里没拿到 id，再查一次列表（并允许短暂重试，
          # 应对上面说的最终一致性延迟）。
          if [ -z "$RID" ]; then
            echo "响应里没拿到 id，改用列表查询（最多重试 5 次）"
            for i in 1 2 3 4 5; do
              RID="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                     --jq "[.[] | select(.tag_name==\"$TAG\")][0].id // empty" 2>/dev/null || true)"
              [ -n "$RID" ] && break
              echo "  第 $i 次为空，等 3s 重试…"
              sleep 3
            done
          fi
          if [ -z "$RID" ]; then
            echo "::error::拿不到 release id —— 无法上传"; exit 1
          fi
          echo "上传目标 release id=$RID"

          # ★★ 必须用 REST API 直接传，**不能用 `gh release upload`** ★★
          #
          # 实测铁证（CI 日志）：id 明明拿到了（404271856），仍然报
          #     release not found
          #
          # 原因：`gh release upload <tag>` 的第一个参数是 **tag**，不是 release id；
          # 它内部走 `GET /releases/tags/<tag>` 解析目标 ——
          # 而 **该端点对草稿返回 404**（本工作流最早就是栽在这上面）。
          # 于是：传 tag → 404；传 id → 被当成 tag → 也 "not found"。
          # 结论：**gh release 子命令根本无法操作草稿**，必须走 REST API。
          #
          # REST 的 assets 上传端点用 **release id**，不受 tag 解析限制。
          # 端点：POST https://uploads.github.com/repos/<owner>/<repo>/releases/<id>/assets?name=<file>
          # --clobber 的等价物：先删同名附件（**仅在草稿上**，符合 AI-DISTRIBUTION §4 例外）。
          UP="https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RID}/assets"
          for f in dist/*.apk dist/checksums.txt; do
            NAME="$(basename "$f")"
            # 草稿重跑时可能已有同名附件 —— 先删（草稿对用户不可见，§4 例外条款）
            OLD="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RID}/assets?per_page=100" \
                   --jq "[.[] | select(.name==\"$NAME\")][0].id // empty" 2>/dev/null || true)"
            if [ -n "$OLD" ]; then
              echo "  删除已存在的同名附件 $NAME (id=$OLD)"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$OLD" >/dev/null
            fi
            echo "  上传 $NAME ($(stat -c%s "$f") B) …"
            gh api -X POST "$UP?name=$NAME" \
              -H "Content-Type: application/octet-stream" \
              --input "$f" --jq '.name + " (" + (.size|tostring) + " B)"' || {
                echo "::error::上传 $NAME 失败"; exit 1; }
          done
          echo "已上传 $(ls dist/*.apk | wc -l) 个 APK + checksums.txt"

      - name: 校验产物齐全后转正
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_ID: ${{ steps.guard.outputs.keep_release_id }}
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # 同上去草稿问题：用 id 查附件数（并容忍列表 API 的延迟）
          if [ -z "$KEEP_ID" ]; then
            for i in 1 2 3 4 5; do
              KEEP_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                         --jq "[.[] | select(.tag_name==\"$TAG\")][0].id // empty" 2>/dev/null || true)"
              [ -n "$KEEP_ID" ] && break
              sleep 3
            done
          fi
          if [ -z "$KEEP_ID" ]; then
            echo "::error::拿不到 release id"; exit 1
          fi
          N=$(gh api "repos/${GITHUB_REPOSITORY}/releases/$KEEP_ID" --jq '.assets | length')
          echo "Release 附件数：$N"
          if [ "$N" -lt 4 ]; then
            echo "::error::产物不全（期望 3 个 APK + checksums = 4），Release 保持草稿"
            gh api "repos/${GITHUB_REPOSITORY}/releases/$KEEP_ID" --jq '.assets[].name' || true
            exit 1
          fi
          # 转正同样用 id（草稿的 tag 解析不可靠，见上）
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/$KEEP_ID" \
            -F draft=false >/dev/null
          echo "Release $TAG 已发布（id=$KEEP_ID）"
