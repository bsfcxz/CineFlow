# =============================================================================
# 功能建议表单
#
# 结构参照经典四段式（防重复确认 → 要解决的问题 → 期望方案 → 替代方案），
# 但按「必填克制」原则把最后一段设为可选。
# 「先说问题再说方案」是刻意的：直接收方案容易被实现绑架，收问题才能对齐
# README 里「当前只做 Android 手机端」「不引入 Go 桥接」这类既有取舍的判断。
# =============================================================================
name: "✨ 功能建议"
description: 提出新功能，或对现有功能的改进想法
labels: ["enhancement"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue（包括已关闭的），没有找到相同建议
          required: true
        - label: 我已看过 README 的「路线图」一节，确认这不是项目明确搁置的方向
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 先说你的使用场景和痛点，而不是直接说方案——这能帮我们判断有没有更好的做法。
      placeholder: "例：我在外面用流量看片，想默认用低码率，但每次都要手动调……"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的做法
      description: 你设想中这个功能是怎么工作的？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与补充（可选）
      description: 考虑过的其他做法、其他软件里类似功能的截图或链接等。
    validations:
      required: false
